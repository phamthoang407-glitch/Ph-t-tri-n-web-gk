<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Bakery - Quản lý</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <header class="header">
        <div class="container nav">
            <a href="index.html" class="logo"><img src="images/bakery-avatar.png" alt="Sweet Bakery"> Sweet Bakery</a>
            <nav>
                <a href="index.html">Trang chủ</a>
                <a href="products.html">Sản phẩm</a>
                <a href="cart.html">Giỏ hàng 🛒</a>
                <a href="admin.html">Quản lý</a>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <h1>📋 Quản lý sản phẩm</h1>

            <div class="form-box">
                <input type="hidden" id="edit-id">
                <input type="text" id="name" placeholder="Tên bánh">
                <input type="number" id="price" placeholder="Giá">
                <select id="product-category">
                    <option value="Bánh kem">Bánh kem</option>
                    <option value="Bánh ngọt">Bánh ngọt</option>
                    <option value="Bánh mì">Bánh mì</option>
                </select>
                <div class="image-field">
                    <label for="image-file">Ảnh bánh:</label>
                    <input type="file" id="image-file" accept="image/*" onchange="previewImage()">
                    <img id="image-preview" class="image-preview" alt="Xem trước ảnh bánh" hidden>
                </div>
                <button class="btn" onclick="saveProduct()">Lưu sản phẩm</button>
                <button class="btn secondary" onclick="clearForm()">Làm mới</button>
            </div>

            <div id="admin-list"></div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Sweet Bakery</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
